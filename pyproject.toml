[project]
name = "cendor-sdk"
version = "1.1.0"
description = "Build an LLM agent with spending limits, a tamper-evident audit trail, PII redaction, and record/replay testing built in from the start — a governed agent in about 10 lines."
readme = "README-pypi.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Raghav Mishra (PowerAI Labs)" }]
keywords = ["agent", "sdk", "llm", "governance", "budget", "audit", "openai", "anthropic"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

# Batteries-included: bundle the whole Cendor stack by depending on the published libraries
# (loose >=1.x,<2 ranges so a user who installs cendor-sdk AND a library à la carte resolves to
# one compatible set). NEVER vendor — one cendor.* subpackage per distribution (we ship cendor.sdk).
dependencies = [
  "cendor-core>=1.3.1,<2",         # trace()/current_trace_id() correlation + HF InferenceClient detection
  "cendor-tokenguard>=1.1.1,<2",   # budget()/track()
  "cendor-acttrace>=1.2.1,<2",     # AuditLog/guard/Policy (guard redact-before-send needs core>=1.1)
  "cendor-contextkit>=1.0.1,<2",   # assemble-to-budget + provider message adapters
  "cendor-squeeze>=1.0.1,<2",      # compress() (a Compressor; auto-wires via core's seam)
  "cendor-cassette>=1.0.1,<2",     # record/replay — the SDK's test fixture format AND replay engine
]

[project.optional-dependencies]
# Provider SDKs stay optional extras — never hard deps (CLAUDE.md).
openai = ["openai>=2.44.0"]
anthropic = ["anthropic>=0.116.0"]
google = ["google-genai>=2.10.0"]
bedrock = ["boto3>=1.43.41"]
ollama = ["ollama>=0.6.2"]
huggingface = ["huggingface_hub>=1.22.0"]  # InferenceClient.chat_completion (OpenAI-shaped)
azure = ["openai>=2.44.0"]                   # Foundry via the standard OpenAI SDK + /openai/v1/ base_url
foundry-local = ["openai>=2.44.0", "foundry-local-sdk>=1.2.3"]  # on-device Foundry Local (OpenAI-compat)
mcp = ["mcp>=1.28.1"]                       # consume MCP tools as Tools
otel = ["cendor-core[otel]"]            # full-run gen_ai span tree
all = [
  "openai>=2.44.0",              # also covers [azure] + [foundry-local] client construction
  "anthropic>=0.116.0",
  "google-genai>=2.10.0",
  "boto3>=1.43.41",
  "ollama>=0.6.2",
  "huggingface_hub>=1.22.0",
  "foundry-local-sdk>=1.2.3",
  "mcp>=1.28.1",
  "cendor-core[otel]",
]

[project.urls]
Homepage = "https://github.com/cendorhq/cendor-sdk"
Documentation = "https://cendor.ai/docs/sdk/getting-started"
Repository = "https://github.com/cendorhq/cendor-sdk"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cendor"]     # contributes cendor/sdk ONLY — NEVER add src/cendor/__init__.py

# --- Dev-time source override (plan §4) ---------------------------------------------------------
# Resolve the Cendor libraries from the local monorepo checkout (editable) for fast iteration
# against a local core without publishing every change. A RELEASED build drops this table and the
# loose PyPI ranges above take effect. This is dev-only and never ships in the wheel.
[tool.uv.sources]
cendor-core = { path = "../cendor-libs/packages/cendor-core", editable = true }
cendor-tokenguard = { path = "../cendor-libs/packages/cendor-tokenguard", editable = true }
cendor-acttrace = { path = "../cendor-libs/packages/cendor-acttrace", editable = true }
cendor-contextkit = { path = "../cendor-libs/packages/cendor-contextkit", editable = true }
cendor-squeeze = { path = "../cendor-libs/packages/cendor-squeeze", editable = true }
cendor-cassette = { path = "../cendor-libs/packages/cendor-cassette", editable = true }

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "hypothesis>=6.156.1",
  "ruff>=0.15.20",
  "mypy>=2.1.0",
  # Tests exercise the real openai/anthropic stack with HTTP mocked by respx — no network, no keys.
  "respx>=0.23.1",
  "httpx>=0.28.1",
  "openai>=2.44.0",
  "anthropic>=0.116.0",
  # interop tests: OTel span-tree assertions use the in-memory exporter.
  "opentelemetry-api>=1.43.0",
  "opentelemetry-sdk>=1.43.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
namespace_packages = true
explicit_package_bases = true

# Optional provider/interop SDKs are imported lazily behind try/except — not installed by default,
# so don't fail type-checking when their stubs are absent.
[[tool.mypy.overrides]]
module = [
  "openai.*",
  "anthropic.*",
  "google.*",
  "boto3.*",
  "ollama.*",
  "huggingface_hub.*",
  "mcp.*",
  "respx.*",
  "opentelemetry.*",
]
ignore_missing_imports = true
