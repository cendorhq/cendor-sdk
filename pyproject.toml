[project]
name = "cendor-sdk"
version = "1.16.0"
description = "Build an LLM agent with spending limits, a tamper-evident audit trail, PII redaction, and record/replay testing built in from the start — a governed agent in about 10 lines."
readme = "README-pypi.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Raghav Mishra (PowerAI Labs)" }]
keywords = ["agent", "sdk", "llm", "governance", "budget", "audit", "openai", "anthropic"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

# Batteries-included: bundle the whole Cendor stack by depending on the published libraries
# (loose >=1.x,<2 ranges so a user who installs cendor-sdk AND a library à la carte resolves to
# one compatible set). NEVER vendor — one cendor.* subpackage per distribution (we ship cendor.sdk).
dependencies = [
  "cendor-core>=1.10,<2",        # stream-observer seam + visible-thinking estimation + converse_stream/async-detect (1.10)
  "cendor-tokenguard>=1.5,<2",   # on_exceed="break" mid-stream breaker + nested-provider clamp (1.5)
  "cendor-guardrails>=1.6,<2",   # rules.intent / custom_category / presets / policy_schema / azure harm-categories (1.4); decisions counter (1.6)
  "cendor-acttrace>=1.10,<2",     # dual-shape guard (1.5); OTelMirror + AuditLog(mirror=) (1.6); mirror completeness — budget identity/numbers, usage/severity/policy (1.7)
  "cendor-contextkit>=1.0,<2",   # assemble-to-budget (context_budget history packing)
  "cendor-squeeze>=1.0,<2",      # compress() (a Compressor; contextkit discovers it at eviction)
  "cendor-cassette>=1.1,<2",     # record/replay — the SDK's test fixture format AND replay engine
]

[project.optional-dependencies]
# Provider SDKs stay optional extras — never hard deps (CLAUDE.md).
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
google = ["google-genai>=0.3"]
bedrock = ["boto3>=1.34"]
ollama = ["ollama>=0.3"]
huggingface = ["huggingface_hub>=0.28"]  # InferenceClient.chat_completion (OpenAI-shaped)
azure = ["openai>=1.0"]                   # Foundry via the standard OpenAI SDK + /openai/v1/ base_url
foundry-local = ["openai>=1.0", "foundry-local-sdk>=0.3"]  # on-device Foundry Local (OpenAI-compat)
mcp = ["mcp>=1.0"]                       # consume MCP tools as Tools
otel = ["cendor-core[otel]"]            # full-run gen_ai span tree
all = [
  "openai>=1.0",              # also covers [azure] + [foundry-local] client construction
  "anthropic>=0.30",
  "google-genai>=0.3",
  "boto3>=1.34",
  "ollama>=0.3",
  "huggingface_hub>=0.28",
  "foundry-local-sdk>=0.3",
  "mcp>=1.0",
  "cendor-core[otel]",
]

[project.urls]
Homepage = "https://github.com/cendorhq/cendor-sdk"
Documentation = "https://cendor.ai/docs/sdk/getting-started"
Repository = "https://github.com/cendorhq/cendor-sdk"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cendor"]     # contributes cendor/sdk ONLY — NEVER add src/cendor/__init__.py

# Bundle the shared assistant/integration guide (verbatim copy of cendor-libs/INTEGRATION.md; kept
# at this repo root, which is the package root, so it round-trips through the sdist).
[tool.hatch.build.targets.wheel.force-include]
"INTEGRATION.md" = "cendor/sdk/INTEGRATION.md"

# --- Dev-time source override (plan §4) ---------------------------------------------------------
# Resolve the Cendor libraries from the local monorepo checkout (editable) for fast iteration
# against a local core without publishing every change. A RELEASED build drops this table and the
# loose PyPI ranges above take effect. This is dev-only and never ships in the wheel.
[tool.uv.sources]
cendor-core = { path = "../cendor-libs/packages/cendor-core", editable = true }
cendor-tokenguard = { path = "../cendor-libs/packages/cendor-tokenguard", editable = true }
cendor-guardrails = { path = "../cendor-libs/packages/cendor-guardrails", editable = true }
cendor-acttrace = { path = "../cendor-libs/packages/cendor-acttrace", editable = true }
cendor-contextkit = { path = "../cendor-libs/packages/cendor-contextkit", editable = true }
cendor-squeeze = { path = "../cendor-libs/packages/cendor-squeeze", editable = true }
cendor-cassette = { path = "../cendor-libs/packages/cendor-cassette", editable = true }

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "hypothesis>=6",
  "ruff==0.15.20",
  "mypy>=1.10",
  # Tests exercise the real openai/anthropic stack with HTTP mocked by respx — no network, no keys.
  "respx>=0.21",
  "httpx>=0.27",
  "openai>=1.0",
  "anthropic>=0.30",
  # interop tests: OTel span-tree assertions use the in-memory exporter.
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
namespace_packages = true
explicit_package_bases = true

# Optional provider/interop SDKs are imported lazily behind try/except — not installed by default,
# so don't fail type-checking when their stubs are absent.
[[tool.mypy.overrides]]
module = [
  "openai.*",
  "anthropic.*",
  "google.*",
  "boto3.*",
  "ollama.*",
  "huggingface_hub.*",
  "mcp.*",
  "respx.*",
  "opentelemetry.*",
]
ignore_missing_imports = true
