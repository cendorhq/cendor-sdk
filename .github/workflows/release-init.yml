name: Release init CLI

# Publishes the `cendor-init` CLI (the standalone package in cendor-init/) to PyPI via OIDC
# **trusted publishing**. Kept SEPARATE from release.yml — which tag-publishes the cendor-sdk package
# at the repo root — so cendor-init versions and ships independently and the cendor-sdk release path
# stays untouched. cendor-init has no docs dependency (templates are plain .py constants), so this
# needs no docs token — just `uv build` + OIDC upload.
#
# Trusted publisher to configure on PyPI (pending publisher, since the project is new):
#   PyPI project: cendor-init · Owner: cendorhq · Repository: cendor-sdk
#   Workflow: release-init.yml · Environment: init
#
# MANUAL ONLY for now (workflow_dispatch) — held for the launch gate.
on:
  workflow_dispatch:

concurrency: release-init-${{ github.ref }}

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: init # matches the PyPI trusted publisher
    permissions:
      id-token: write # OIDC trusted publishing — no stored token
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      # Gate the publish on the same lint/type/test checks CI runs — never ship an unlinted build.
      - name: sync (dev extras)
        working-directory: cendor-init
        run: uv sync --extra dev
      - name: ruff lint
        working-directory: cendor-init
        run: uv run ruff check .
      - name: ruff format check
        working-directory: cendor-init
        run: uv run ruff format --check .
      - name: type-check
        working-directory: cendor-init
        run: uv run mypy src
      - name: tests
        working-directory: cendor-init
        run: uv run pytest -q
      - name: Build cendor-init (wheel + sdist)
        working-directory: cendor-init
        run: uv build
      - name: Publish to PyPI (OIDC trusted publishing)
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          packages-dir: cendor-init/dist
