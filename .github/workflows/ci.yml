name: CI
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs for the same ref (PR pushes); never cancel a main-branch build.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The default GITHUB_TOKEN needs only checkout — least privilege for a public repo.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]   # development happens on Windows — test it too
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash   # Git Bash on the Windows runner, so `find`/heredocs work cross-platform
    steps:
      # cendor-libs is a PRIVATE sibling repo; the default GITHUB_TOKEN cannot read it (404), and the
      # dev [tool.uv.sources] override in pyproject resolves cendor-* from ../cendor-libs/packages/*.
      # Degrade gracefully on the token: if a SIBLING_CHECKOUT_TOKEN PAT (read access to
      # cendorhq/cendor-libs) is set, check the sibling out and test against LOCAL sources; if it is
      # absent, skip the checkout and set UV_NO_SOURCES=1 so uv ignores the sources table and resolves
      # the PUBLISHED cendor-* from PyPI — CI stays green and meaningful either way, no secret required.
      # Once cendor-libs is public, drop this decision step + the sibling checkout's token: line.
      - name: Decide dependency source (local sibling vs published PyPI)
        id: deps
        env:
          SIBLING_CHECKOUT_TOKEN: ${{ secrets.SIBLING_CHECKOUT_TOKEN }}
        run: |
          if [ -n "$SIBLING_CHECKOUT_TOKEN" ]; then
            echo "sibling=true" >> "$GITHUB_OUTPUT"
            echo "cendor-* -> LOCAL cendor-libs sibling checkout"
          else
            echo "sibling=false" >> "$GITHUB_OUTPUT"
            echo "UV_NO_SOURCES=1" >> "$GITHUB_ENV"   # applies to every later uv sync / uv run step
            echo "SIBLING_CHECKOUT_TOKEN absent -> testing against PUBLISHED cendor-* from PyPI"
          fi
      - name: Check out cendor-libs sibling (only when the PAT is present)
        if: steps.deps.outputs.sibling == 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: cendorhq/cendor-libs
          token: ${{ secrets.SIBLING_CHECKOUT_TOKEN }}
          path: cendor-libs      # the dev source override in pyproject resolves ../cendor-libs/packages/*
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          path: cendor-sdk
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      - name: sync
        working-directory: cendor-sdk
        run: uv sync
      - name: ruff lint
        working-directory: cendor-sdk
        run: uv run ruff check .
      - name: ruff format check
        working-directory: cendor-sdk
        run: uv run ruff format --check .
      - name: namespace guard (no top-level cendor/__init__.py)
        working-directory: cendor-sdk
        run: |
          if find src -path '*/cendor/__init__.py' | grep . ; then
            echo "ERROR: a top-level cendor/__init__.py exists — it breaks the PEP 420 namespace"; exit 1
          fi
          echo "namespace-guard: OK"
      - name: type-check
        working-directory: cendor-sdk
        run: uv run mypy -p cendor.sdk
      - name: tests
        working-directory: cendor-sdk
        run: uv run pytest -q
      - name: import check
        working-directory: cendor-sdk
        run: uv run python -c "import cendor.sdk; print('import cendor.sdk OK', cendor.sdk.__version__)"
