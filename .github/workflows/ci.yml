name: CI
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs for the same ref (PR pushes); never cancel a main-branch build.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The default GITHUB_TOKEN needs only checkout — least privilege for a public repo.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]   # development happens on Windows — test it too
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash   # Git Bash on the Windows runner, so `find`/heredocs work cross-platform
    steps:
      # cendor-libs is a PRIVATE sibling repo; the default GITHUB_TOKEN cannot read it (404), and the
      # dev [tool.uv.sources] override in pyproject resolves cendor-* from ../cendor-libs/packages/*.
      # Degrade gracefully on the token: if a SIBLING_CHECKOUT_TOKEN PAT (read access to
      # cendorhq/cendor-libs) is set, check the sibling out and test against LOCAL sources; if it is
      # absent, skip the checkout and set UV_NO_SOURCES=1 so uv ignores the sources table and resolves
      # the PUBLISHED cendor-* from PyPI — CI stays green and meaningful either way, no secret required.
      # Once cendor-libs is public, drop this decision step + the sibling checkout's token: line.
      - name: Decide dependency source (local sibling vs published PyPI)
        id: deps
        env:
          SIBLING_CHECKOUT_TOKEN: ${{ secrets.SIBLING_CHECKOUT_TOKEN }}
        run: |
          if [ -n "$SIBLING_CHECKOUT_TOKEN" ]; then
            echo "sibling=true" >> "$GITHUB_OUTPUT"
            echo "cendor-* -> LOCAL cendor-libs sibling checkout"
          else
            echo "sibling=false" >> "$GITHUB_OUTPUT"
            echo "UV_NO_SOURCES=1" >> "$GITHUB_ENV"   # applies to every later uv sync / uv run step
            echo "SIBLING_CHECKOUT_TOKEN absent -> testing against PUBLISHED cendor-* from PyPI"
          fi
      - name: Check out cendor-libs sibling (only when the PAT is present)
        if: steps.deps.outputs.sibling == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          repository: cendorhq/cendor-libs
          token: ${{ secrets.SIBLING_CHECKOUT_TOKEN }}
          path: cendor-libs      # the dev source override in pyproject resolves ../cendor-libs/packages/*
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          path: cendor-sdk
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: sync
        working-directory: cendor-sdk
        run: uv sync
      - name: ruff lint
        working-directory: cendor-sdk
        run: uv run ruff check .
      - name: ruff format check
        working-directory: cendor-sdk
        run: uv run ruff format --check .
      - name: namespace guard (no top-level cendor/__init__.py)
        working-directory: cendor-sdk
        run: |
          if find src -path '*/cendor/__init__.py' | grep . ; then
            echo "ERROR: a top-level cendor/__init__.py exists — it breaks the PEP 420 namespace"; exit 1
          fi
          echo "namespace-guard: OK"
      - name: type-check
        working-directory: cendor-sdk
        run: uv run mypy -p cendor.sdk
      - name: tests
        working-directory: cendor-sdk
        run: uv run pytest -q
      - name: import check
        working-directory: cendor-sdk
        run: uv run python -c "import cendor.sdk; print('import cendor.sdk OK', cendor.sdk.__version__)"

  # GATE G2 — floors-honest.
  #
  # pyproject declares a floor per library ("cendor-core>=1.14,<2"). Nothing ever asserted that the
  # DECLARED floor actually works: normal CI resolves the newest compatible versions, so a floor that
  # is too low is invisible here and only breaks for a user who pins conservatively. uv's
  # `--resolution lowest-direct` installs exactly the declared floors, which turns the range from a
  # claim into a tested one. UV_NO_SOURCES=1 is required — otherwise the dev [tool.uv.sources] table
  # resolves the libraries from the local monorepo and the floors are never exercised at all.
  #
  # Measured 2026-07-27 at core 1.14.0 / acttrace 1.13.0 / tokenguard 1.6.0 / guardrails 1.6.0 /
  # cassette 1.1.0 / contextkit 1.0.1 / squeeze 1.0.1: 287 passed. The floors are honest today; this
  # job is what keeps them honest after the next feature lands without a floor bump.
  floors:
    name: G2 — suite passes at the declared dependency floors
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      UV_NO_SOURCES: '1' # ignore the dev sources table: resolve the PUBLISHED floors from PyPI
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: install at the LOWEST declared direct versions
        run: |
          uv venv .floors
          uv pip install --python .floors --resolution lowest-direct .
          # Test tooling is installed normally — lowering pytest itself proves nothing about our floors.
          uv pip install --python .floors pytest pytest-asyncio hypothesis respx httpx openai anthropic \
            opentelemetry-api opentelemetry-sdk
      - name: show what resolved (this list IS the claim the ranges make)
        run: uv pip list --python .floors | grep cendor
      - name: tests at the floors
        run: .floors/bin/python -m pytest tests -q

  # cendor-init is a SELF-CONTAINED, dependency-light package (stdlib only + dev tooling) living in
  # this repo but deliberately outside the uv workspace. It has no cendor-* deps, so it needs no
  # sibling checkout / PyPI decision dance — a plain `uv sync --extra dev` is enough. This job makes
  # its 25 tests + ruff actually run on every push (previously they ran nowhere; the twin drift class
  # this pin guards against was latent only because CI never linted it).
  cendor-init:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: cendor-init
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: sync (dev extras)
        run: uv sync --extra dev
      - name: ruff lint
        run: uv run ruff check .
      - name: ruff format check
        run: uv run ruff format --check .
      - name: type-check
        run: uv run mypy src
      - name: tests
        run: uv run pytest -q
