blank_issues_enabled: false
contact_links:
  - name: Security vulnerability (private report)
    url: https://github.com/cendorhq/cendor-sdk/security/advisories/new
    about: Never a public issue — report privately via GitHub Private Vulnerability Reporting. See SECURITY.md.
  - name: SDK documentation
    url: https://cendor.ai/docs/sdk/getting-started
    about: A question, a "how do I …", or an unclear page — start here. Providers, governance, memory, interop, and the FAQ.
  - name: Correct call shapes (and the common wrong ones)
    url: https://cendor.ai/docs/for-ai-assistants
    about: The maintained trap registry and canonical examples — including the SDK-specific ones. Check here before filing a bug about an API that "does not exist".
  - name: A bug in a library beneath the SDK
    url: https://github.com/cendorhq/cendor-libs/issues
    about: "cendor-core, tokenguard, guardrails, acttrace, contextkit, squeeze, cassette — the SDK re-exports the real objects, so those bugs live upstream."
  - name: TypeScript SDK (@cendor/sdk on npm)
    url: https://github.com/cendorhq/cendor-sdk-js/issues
    about: This repo is the Python SDK. File TypeScript bugs and requests on cendor-sdk-js.
  - name: Cookbook — copy-paste recipes
    url: https://cendor.ai/cookbook
    about: Every recipe runs offline with no API key, including a governed agent. The quickest way to get a working repro to attach to a bug report.
