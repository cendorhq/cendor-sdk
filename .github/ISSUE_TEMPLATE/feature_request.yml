name: Feature request
description: Suggest an idea or improvement for cendor-sdk or the cendor-init CLI.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The SDK is a *governed agent loop* built on the Cendor libraries: budgets, audit, redaction,
        context governance, and record/replay are the foundation, not plugins. It adds **no governance
        machinery of its own** — it attaches to `cendor-core`'s bus / interceptor / `Sink` /
        `Compressor` seams and patches nothing. The checkboxes at the bottom are the constraints most
        proposals meet.
  - type: dropdown
    id: area
    attributes:
      label: Which area?
      options:
        - Agent loop / tools
        - Providers (a new provider path, or a response-shape gap)
        - Multi-agent (handoff, sequential, parallel, supervisor)
        - Governance (budget, guard, Policy, AuditLog, trace)
        - Guardrails
        - Sessions, memory, checkpoint/resume
        - RAG / embeddings
        - Interop (MCP, A2A, Foundry, Microsoft 365 Agents SDK)
        - Streaming
        - Eval harness
        - Observability / OTel export
        - cendor-init (the offline init/doctor CLI)
        - Docs
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case first — what your agent has to do, and what is in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would the API look like? A full signature with type hints is ideal, plus the one-line correct call shape a user would copy.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Including "I wrote it around the SDK like this" — that is useful signal.
  - type: checkboxes
    id: principles
    attributes:
      label: Fit with how the SDK is built
      description: If one of these does not hold, say so in the proposal — it may still be the right idea, just in a different place.
      options:
        - label: This stays local-first — no required account, network, or running server, and provider SDKs stay optional extras.
        - label: This cooperates through `cendor-core`'s seams rather than patching a provider SDK or duplicating governance the libraries already own.
        - label: This is a governed-agent-loop concern, not a generic library feature — a generic one belongs in [cendor-libs](https://github.com/cendorhq/cendor-libs) instead.
        - label: It can be tested offline (mocked provider HTTP or a recorded cassette), with no API key.
        - label: Any number this would let me claim is reproducible from the tests or a benchmark.
